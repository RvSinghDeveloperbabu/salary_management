version: 2
updates:
  # The Gemfile is under api/, not at the root. Dependabot config itself must
  # live at the root regardless. The /web npm ecosystem is added in phase 7.
  - package-ecosystem: bundler
    directory: "/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
