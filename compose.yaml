# Development environment.
#
# There is no database service: SQLite is a file, not a server, which is half
# the reason it was chosen. The database lives in a named volume so a 10k-row
# seed never touches the host filesystem or git.

name: salary-management

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    volumes:
      # Source is bind-mounted, so host edits are live without a rebuild.
      - ./api:/app
      # Named volumes shadow the bind mount. Gems and the database are
      # Linux artefacts and must not leak onto a macOS host.
      - bundle:/usr/local/bundle
      - sqlite:/app/storage
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      # Bind to all interfaces or the port is unreachable from the host.
      BINDING: 0.0.0.0
    stdin_open: true
    tty: true

  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./web:/app
      # Shadows the bind mount. node_modules holds platform-specific
      # binaries, and resolving tens of thousands of small files across a
      # macOS bind mount is slow enough to be worth avoiding.
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      # Vite proxies /api to the api service by name. The proxy runs
      # server-side, so the browser only ever sees localhost:5173 — same
      # origin, no CORS, and no SameSite cookie problem.
      VITE_API_PROXY_TARGET: http://api:3000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  bundle:
  sqlite:
  node_modules:
