# Secret that holds the MySQL root password.
# 10-sql_db.yaml reads it as: name sql-db-secret, key mysql-root-password.
#
# The "09-" prefix makes this file apply before 10-sql_db.yaml.
#
# WARNING: the value below is only a placeholder for LOCAL testing.
# Change it, and do NOT commit a real password. For anything real, create the
# secret from the command line instead of keeping it in a file:
#   kubectl -n salary-management create secret generic sql-db-secret \
#     --from-literal=mysql-root-password='your-password'
apiVersion: v1
kind: Secret
metadata:
  name: sql-db-secret
  namespace: salary-management
  labels:
    app.kubernetes.io/part-of: salary-management
type: Opaque
# stringData lets you write the value as plain text.
# Kubernetes stores it base64-encoded. That is encoding, not encryption.
stringData:
  mysql-root-password: "root"
